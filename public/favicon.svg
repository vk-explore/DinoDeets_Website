<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3C34"/>
      <stop offset="100%" style="stop-color:#0E1A16"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#D4A843" stroke-width="2.5"/>
  <!-- Dinosaur footprint -->
  <g fill="#D4A843" transform="translate(32, 34)">
    <!-- Main pad -->
    <ellipse cx="0" cy="4" rx="9" ry="11" opacity="0.95"/>
    <!-- Left toe -->
    <ellipse cx="-8" cy="-12" rx="3.5" ry="5.5" transform="rotate(-20, -8, -12)"/>
    <!-- Center toe -->
    <ellipse cx="0" cy="-15" rx="3.5" ry="6"/>
    <!-- Right toe -->
    <ellipse cx="8" cy="-12" rx="3.5" ry="5.5" transform="rotate(20, 8, -12)"/>
  </g>
</svg>
